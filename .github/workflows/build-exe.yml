name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.126

      - name: Build WASM package
        run: |
          cargo build --manifest-path rust-fuzzy/Cargo.toml --target wasm32-unknown-unknown --release
          wasm-bindgen rust-fuzzy/target/wasm32-unknown-unknown/release/fuzzy_search.wasm --out-dir rust-fuzzy/pkg --target web

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-package
          path: rust-fuzzy/pkg

  build-exe:
    needs: build-wasm
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Download WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-package
          path: rust-fuzzy/pkg

      - name: Install Dependencies
        run: npm ci

      - name: Build Windows EXE
        run: npx electron-builder --win --x64

      - name: Upload EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: listen1-exe
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.nsis.*